server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_vary on;
  gzip_types text/html text/css application/javascript application/json image/svg+xml application/xml;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options SAMEORIGIN always;

  # assets sin hash en el nombre: caché corta para que un deploy se vea rápido
  location /assets/ {
    add_header Cache-Control "public, max-age=86400" always;
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
  }

  # el 404 se sirve interno: /404.html no se pide nunca por URL
  location = /404.html {
    internal;
    add_header X-Content-Type-Options nosniff always;
  }

  # rutas viejas que hoy devuelven 404; cada una va a donde vive el contenido
  location = /servicios/ { return 301 /#productos; }
  location = /contacto/ { return 301 /#contacto; }
  location = /politica-de-privacidad/ { return 301 /privacidad/; }
  location = /preguntas-frecuentes-ia-automatizacion/ { return 301 /faq/; }
  location ^~ /blog/ { return 301 https://iapo.cl$request_uri; }

  location / {
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
    try_files $uri $uri/ =404;
  }

  error_page 404 /404.html;
}
